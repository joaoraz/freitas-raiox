<script>
(function(){
if(sessionStorage.getItem('dash_access_ok')){document.getElementById('accessGate').style.display='none';return}
function getLeadsDB(){try{return JSON.parse(localStorage.getItem('leads_db')||'[]')}catch(e){return[]}}
document.getElementById('gateForm').addEventListener('submit',function(e){
e.preventDefault();
var btn=document.getElementById('gateBtn'),err=document.getElementById('gateError');
err.style.display='none';
var email=document.getElementById('gateEmail').value.trim().toLowerCase();
var code=document.getElementById('gateCode').value.trim().toUpperCase();
if(!email||!code){err.textContent='Preencha e-mail e código.';err.style.display='block';return}
btn.disabled=true;btn.textContent='Verificando...';
setTimeout(function(){
var db=getLeadsDB(),found=false;
for(var i=0;i<db.length;i++){if(db[i].email.toLowerCase()===email&&db[i].code===code){found=true;break}}
if(found){sessionStorage.setItem('dash_access_ok','1');document.getElementById('accessGate').style.display='none'}
else{err.textContent='E-mail ou código inválido. Verifique e tente novamente.';err.style.display='block';btn.disabled=false;btn.textContent='Entrar'}
},800);
});
})();
</script>

function AnimatedCounter({end,duration=2000,prefix="",suffix="",decimals=0}){
const[count,setCount]=useState(0);const[started,setStarted]=useState(false);const ref=useRef(null);
useEffect(()=>{const o=new IntersectionObserver(([e])=>{if(e.isIntersecting)setStarted(true)},{threshold:.3});if(ref.current)o.observe(ref.current);return()=>o.disconnect()},[]);
useEffect(()=>{if(!started)return;let s=0;const st=end/(duration/16);const t=setInterval(()=>{s+=st;if(s>=end){setCount(end);clearInterval(t)}else setCount(s)},16);return()=>clearInterval(t)},[started,end,duration]);
return<span ref={ref}>{prefix}{count.toFixed(decimals).replace(/\B(?=(\d{3})+(?!\d))/g,".")}{suffix}</span>;
}
