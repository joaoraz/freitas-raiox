function AnimNum({ end, prefix = "", suffix = "", duration = 2000, decimals = 1 }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !started.current) {
        started.current = true;
        const s = performance.now();
        const go = (n) => { const p = Math.min((n - s) / duration, 1); setVal((1 - Math.pow(1 - p, 3)) * end); if (p < 1) requestAnimationFrame(go); };
        requestAnimationFrame(go);
      }
    }, { threshold: 0.3 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [end, duration]);
  return <span ref={ref}>{prefix}{val.toFixed(decimals)}{suffix}</span>;
}

// SIMULADOR
// ═══════════════════════════════════════════
function Simulador() {
  const [fob, setFob] = useState(100000);
  const [frete, setFrete] = useState(8);
  const [seguro, setSeguro] = useState(1);
  const [ii, setIi] = useState(14);
  const [ipi, setIpi] = useState(10);
  const [pis, setPis] = useState(2.1);
  const [cofins, setCofins] = useState(9.65);
  const [icms, setIcms] = useState(18);

  const cif = fob * (1 + frete / 100 + seguro / 100);
  const vII = cif * (ii / 100);
  const vIPI = (cif + vII) * (ipi / 100);
  const vPIS = cif * (pis / 100);
  const vCOF = cif * (cofins / 100);
  const baseICMS = (cif + vII + vIPI + vPIS + vCOF) / (1 - icms / 100);
  const vICMS = baseICMS * (icms / 100);
  const afrmm = fob * (frete / 100) * 0.25;
  const siscomex = 214.50;
  const totalTax = vII + vIPI + vPIS + vCOF + vICMS + afrmm + siscomex;
  const landed = cif + totalTax;
  const pctFob = ((landed / fob - 1) * 100);

  const Sl = ({ label, value, onChange, min, max, step = 0.1, unit = "%", hint }) => (
    <div style={{ marginBottom: 18 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 2 }}>
        <span style={{ fontSize: 13, fontWeight: 600, color: C.gray700 }}>{label}</span>
        <span style={{ fontSize: 13, fontWeight: 700, color: C.navy }}>{unit === "US$" ? `US$ ${value.toLocaleString("pt-BR")}` : `${value}${unit}`}</span>
      </div>
      {hint && <div style={{ fontSize: 11, color: C.gray300, marginBottom: 4 }}>{hint}</div>}
      <input type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))} style={{ width: "100%", accentColor: C.navy, height: 4 }} />
    </div>
  );

  const Ln = ({ label, value }) => (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: `1px solid ${C.gray100}`, fontSize: 13 }}>
      <span style={{ color: C.gray500 }}>{label}</span>
      <span style={{ fontWeight: 600, color: C.gray900 }}>US$ {value.toLocaleString("pt-BR", { maximumFractionDigits: 0 })}</span>
    </div>
  );

  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 32 }}>
      <div>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.gray700, marginBottom: 16, textTransform: "uppercase", letterSpacing: 1 }}>Parâmetros</div>
        <Sl label="Valor FOB" value={fob} onChange={setFob} min={5000} max={5000000} step={5000} unit="US$" hint="Valor da mercadoria na origem" />
        <Sl label="Frete Internacional" value={frete} onChange={setFrete} min={1} max={25} hint="% do FOB em transporte" />
        <Sl label="Seguro" value={seguro} onChange={setSeguro} min={0.1} max={5} hint="Seguro de transporte internacional" />
        <div style={{ height: 1, background: C.gray100, margin: "12px 0" }} />
        <Sl label="II (Imposto de Importação)" value={ii} onChange={setIi} min={0} max={35} hint="Varia conforme NCM" />
        <Sl label="IPI" value={ipi} onChange={setIpi} min={0} max={30} hint="Sobre CIF + II" />
        <Sl label="PIS-Importação" value={pis} onChange={setPis} min={0} max={3.65} step={0.05} />
        <Sl label="COFINS-Importação" value={cofins} onChange={setCofins} min={0} max={12} step={0.05} />
        <Sl label="ICMS" value={icms} onChange={setIcms} min={0} max={25} hint="Varia por UF e produto" />
      </div>
      <div>
        <div style={{ fontSize: 13, fontWeight: 700, color: C.gray700, marginBottom: 16, textTransform: "uppercase", letterSpacing: 1 }}>Resultado</div>
        <div style={{ background: C.navy, borderRadius: 12, padding: 24, marginBottom: 20 }}>
          <div style={{ fontSize: 11, color: C.gray300, textTransform: "uppercase", letterSpacing: 1.5 }}>Custo Total Nacionalizado</div>
          <div style={{ fontSize: 32, fontWeight: 800, color: C.white, marginTop: 4 }}>US$ {landed.toLocaleString("pt-BR", { maximumFractionDigits: 0 })}</div>
          <div style={{ fontSize: 13, color: C.orange, fontWeight: 600, marginTop: 4 }}>+{pctFob.toFixed(1)}% sobre o FOB</div>
          <div style={{ fontSize: 12, color: C.gray300, marginTop: 8, lineHeight: 1.5 }}>Para cada US$ 1,00 comprado, o custo final é US$ {(landed / fob).toFixed(2)} no estoque.</div>
        </div>
        <Ln label="Valor CIF" value={cif} />
        <Ln label="II" value={vII} />
        <Ln label="IPI" value={vIPI} />
        <Ln label="PIS" value={vPIS} />
        <Ln label="COFINS" value={vCOF} />
        <Ln label="ICMS (por dentro)" value={vICMS} />
        <Ln label="AFRMM" value={afrmm} />
        <Ln label="Taxa Siscomex" value={siscomex} />
        <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", marginTop: 4, fontSize: 14, fontWeight: 700, color: C.gray900 }}>
          <span>Total de Tributos</span>
          <span style={{ color: C.magenta }}>US$ {totalTax.toLocaleString("pt-BR", { maximumFractionDigits: 0 })}</span>
        </div>
        <FreitasNote>
          Os tributos representam {((totalTax / fob) * 100).toFixed(0)}% do valor FOB.
          {ii >= 14 && ` NCMs com II acima de 14% podem ser elegíveis a ex-tarifário, zerando o II, com economia de US$ ${vII.toLocaleString("pt-BR", { maximumFractionDigits: 0 })} nesta simulação.`}
        </FreitasNote>
      </div>
    </div>
  );
}

function ScoreCalc() {
  const qs = [
    { q: "Sua empresa importou nos últimos 12 meses?", opts: ["Sim, regularmente", "Pontualmente", "Não"], scores: [3, 2, 0] },
    { q: "Você sabe quanto paga de tributos por operação?", opts: ["Sim, com controle", "Estimativa", "Não sei"], scores: [3, 1, 0] },
    { q: "Já utilizou ex-tarifário ou regime especial?", opts: ["Sim, ativamente", "Já ouvi falar", "Nunca"], scores: [3, 1, 0] },
    { q: "Tempo médio de desembaraço?", opts: ["Até 3 dias", "4-10 dias", "Mais de 10 dias"], scores: [3, 2, 0] },
    { q: "Visibilidade em tempo real da carga?", opts: ["Rastreio completo", "Parcial", "Não"], scores: [3, 1, 0] },
    { q: "Já teve carga retida ou multa aduaneira?", opts: ["Nunca", "Uma vez", "Mais de uma vez"], scores: [3, 1, 0] },
    { q: "Equipe de comex é dedicada?", opts: ["Dedicada", "Mista", "Sem controle"], scores: [3, 2, 0] },
    { q: "Analisa dados das importações para decisão?", opts: ["Sim, com dashboards", "Planilhas", "Não analiso"], scores: [3, 1, 0] },
  ];
  const [ans, setAns] = useState(Array(qs.length).fill(-1));
  const [show, setShow] = useState(false);
  const total = ans.reduce((s, r, i) => s + (r >= 0 ? qs[i].scores[r] : 0), 0);
  const pct = Math.round((total / (qs.length * 3)) * 100);
  const done = ans.every(r => r >= 0);
  const nivel = pct >= 90 ? { l: "Excelente", c: "#16a34a", d: "Operação madura. A Freitas pode atuar como parceira estratégica para ganhos incrementais." } : pct >= 70 ? { l: "Boa", c: "#22c55e", d: "Base sólida com oportunidades claras. Um diagnóstico pode revelar 8-15% de redução de custos." } : pct >= 50 ? { l: "Intermediária", c: "#f59e0b", d: "Funciona, mas deixa dinheiro na mesa. Melhorias rápidas com impacto imediato são possíveis." } : pct >= 30 ? { l: "Em desenvolvimento", c: "#f97316", d: "Vulnerabilidades significativas. Custos ocultos consomem margem. Diagnóstico urgente recomendado." } : { l: "Crítica", c: "#dc2626", d: "Riscos altos de multa e perda financeira. Análise emergencial necessária." };

  return !show ? (
    <div>
      {qs.map((p, i) => (
        <div key={i} style={{ marginBottom: 16, padding: "14px 16px", background: ans[i] >= 0 ? "#f0fdf4" : C.gray50, borderRadius: 10, border: `1px solid ${ans[i] >= 0 ? "#bbf7d0" : C.gray100}`, transition: "all 0.2s" }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: C.gray900, marginBottom: 10 }}><span style={{ color: C.magenta, marginRight: 6 }}>{i + 1}.</span>{p.q}</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {p.opts.map((o, j) => (
              <button key={j} onClick={() => { const n = [...ans]; n[i] = j; setAns(n); }}
                style={{ padding: "7px 14px", borderRadius: 6, border: `1.5px solid ${ans[i] === j ? C.navy : C.gray100}`, background: ans[i] === j ? C.navy : C.white, color: ans[i] === j ? C.white : C.gray500, fontWeight: ans[i] === j ? 600 : 400, fontSize: 13, cursor: "pointer", transition: "all 0.15s" }}>
                {o}
              </button>
            ))}
          </div>
        </div>
      ))}
      <button disabled={!done} onClick={() => setShow(true)} style={{ width: "100%", padding: "14px", borderRadius: 10, border: "none", background: done ? C.navy : C.gray100, color: done ? C.white : C.gray300, fontSize: 15, fontWeight: 700, cursor: done ? "pointer" : "default", transition: "all 0.2s" }}>
        {done ? "Ver diagnóstico" : `${ans.filter(r => r >= 0).length} de ${qs.length} respondidas`}
      </button>
    </div>
  ) : (
    <div style={{ textAlign: "center", padding: "20px 0" }}>
      <div style={{ position: "relative", width: 160, height: 160, margin: "0 auto 20px" }}>
        <svg viewBox="0 0 160 160" width="160" height="160">
          <circle cx="80" cy="80" r="68" fill="none" stroke={C.gray100} strokeWidth="10" />
          <circle cx="80" cy="80" r="68" fill="none" stroke={nivel.c} strokeWidth="10" strokeDasharray={`${(pct / 100) * 427} 427`} strokeLinecap="round" transform="rotate(-90 80 80)" style={{ transition: "stroke-dasharray 1s ease-out" }} />
        </svg>
        <div style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)" }}>
          <div style={{ fontSize: 40, fontWeight: 800, color: nivel.c }}>{pct}</div>
          <div style={{ fontSize: 12, color: C.gray300 }}>de 100</div>
        </div>
      </div>
      <div style={{ fontSize: 20, fontWeight: 700, color: nivel.c, marginBottom: 6 }}>{nivel.l}</div>
      <p style={{ fontSize: 14, color: C.gray500, lineHeight: 1.6, maxWidth: 420, margin: "0 auto 20px" }}>{nivel.d}</p>
      <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
        <button onClick={() => { setShow(false); setAns(Array(qs.length).fill(-1)); }} style={{ padding: "10px 20px", borderRadius: 8, border: `1.5px solid ${C.gray200}`, background: "transparent", color: C.gray700, fontWeight: 600, fontSize: 13, cursor: "pointer" }}>Refazer</button>
        <a href="https://wa.me/554730458200" target="_blank" style={{ padding: "10px 20px", borderRadius: 8, border: "none", background: C.navy, color: C.white, fontWeight: 600, fontSize: 13, textDecoration: "none", display: "inline-flex", alignItems: "center", gap: 6 }}>Solicitar diagnóstico <ArrowRight size={14} /></a>
      </div>
    </div>
  );
}
