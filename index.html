function AnimNum({ end, prefix = "", suffix = "", duration = 2000, decimals = 1 }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !started.current) {
        started.current = true;
        const s = performance.now();
        const go = (n) => { const p = Math.min((n - s) / duration, 1); setVal((1 - Math.pow(1 - p, 3)) * end); if (p < 1) requestAnimationFrame(go); };
        requestAnimationFrame(go);
      }
    }, { threshold: 0.3 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [end, duration]);
  return <span ref={ref}>{prefix}{val.toFixed(decimals)}{suffix}</span>;
}

function LandingPage() {
  const [form, setForm] = useState({ nome: "", email: "", empresa: "", cargo: "" });
  const [enviado, setEnviado] = useState(false);
  const formRef = useRef(null);

  const scrollToForm = () => {
    if (formRef.current) formRef.current.scrollIntoView({ behavior: "smooth", block: "center" });
  };

  const handleSubmit = () => {
    if (!form.nome || !form.email || !form.empresa) return;
    setEnviado(true);
  };

  const Field = ({ name, placeholder, required }) => (
    <input
      placeholder={placeholder + (required ? " *" : "")}
